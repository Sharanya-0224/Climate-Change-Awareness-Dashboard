name: CI

on:
  push:
    branches: [india-climate, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install libraries
        run: pip install -r requirements-api.txt pytest==8.4.2 httpx==0.28.1

      - name: Run pytest
        run: python -m pytest

  docker:
    name: Build and check the Docker image
    needs: test
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      IMAGE: sara23chhabra/climate-api
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install what the download script needs
        run: pip install -r requirements-api.txt mlflow==3.1.4

      - name: Download champion models from the registry
        run: |
          python src/api/download_models.py
          cat model_store/versions.json

      - name: Build the Docker image (runs the smoke test)
        run: docker build -t climate-api:${{ github.sha }} -t climate-api:latest .

      - name: Start the container and wait for /health
        run: |
          docker run -d --name api -p 8000:8000 climate-api:latest
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health | grep -q '"status":"ok"'; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done
          docker logs api
          exit 1

      - name: Ask the running container for real predictions
        run: |
          curl -sf http://127.0.0.1:8000/health
          echo
          curl -sf -X POST http://127.0.0.1:8000/predict/india_temperature \
            -H "Content-Type: application/json" \
            -d '{"lat": 26.9, "lon": 75.8, "year": 2030, "month": 5, "co2_ppm": 440}'
          echo
          curl -sf "http://127.0.0.1:8000/rain/forecast?lat=26.9&lon=75.8"
          echo

      # ---- CD part 1: publish the image that just passed every check ----
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push the tested image to Docker Hub
        if: github.event_name == 'push'
        run: |
          docker tag climate-api:latest $IMAGE:latest
          docker tag climate-api:latest $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}

  # ---- CD part 2: tell the hosting platform to run the new image ----
  deploy:
    name: Deploy to Render
    needs: docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - name: Ask Render to pull and run the new image
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK is not set yet: image was pushed, deploy skipped"
            exit 0
          fi
          curl -sf -X POST "$RENDER_DEPLOY_HOOK"
          echo
          echo "Deploy requested"

      - name: Wait for the live site to be healthy
        env:
          LIVE_URL: https://climate-awareness-api.onrender.com
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "No deploy was requested, nothing to check"
            exit 0
          fi
          sleep 60      # give Render time to pull the new image and start it
          for i in $(seq 1 30); do
            if curl -sf --max-time 20 "$LIVE_URL/health" | grep -q '"status":"ok"'; then
              echo "Live site is healthy: $LIVE_URL"
              curl -sf --max-time 20 "$LIVE_URL/health"
              echo
              exit 0
            fi
            sleep 10
          done
          echo "Live site did not report ok within the time limit"
          exit 1
